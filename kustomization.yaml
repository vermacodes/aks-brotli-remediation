apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aks-brotli-remediation
resources:
  - namespace.yaml
  - daemonset.yaml
configMapGenerator:
  - name: brotli-remediation-script
    files:
      - remediate.sh
generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: aks-brotli-remediation
