apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: aks-brotli-remediation
  labels:
    app.kubernetes.io/name: aks-brotli-remediation
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: aks-brotli-remediation
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aks-brotli-remediation
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - operator: Exists
      initContainers:
        - name: remediate
          image: mcr.microsoft.com/mirror/docker/library/ubuntu:24.04
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              set -Eeuo pipefail
              chroot /host /bin/bash -s -- "${NODE_NAME}" < /scripts/remediate.sh
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
            runAsUser: 0
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: host-root
              mountPath: /host
              mountPropagation: HostToContainer
            - name: remediation-script
              mountPath: /scripts
              readOnly: true
      containers:
        - name: hold
          image: mcr.microsoft.com/mirror/docker/library/ubuntu:24.04
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - exec sleep infinity
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              cpu: 10m
              memory: 32Mi
      terminationGracePeriodSeconds: 10
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
        - name: remediation-script
          configMap:
            name: brotli-remediation-script
            defaultMode: 0555
